name: CI - Testes de Automação

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Testes de API (Newman)
        run: npm run test:api

      - name: Testes de UI (Cypress headless + BDD)
        run: npm run test

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: reports/
